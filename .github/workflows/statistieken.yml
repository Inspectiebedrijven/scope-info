# Legt wekelijks de verkeerscijfers van deze repository vast op de branch `statistieken`.
# GitHub bewaart deze cijfers 14 dagen; zonder deze workflow gaat de reeks verloren.
#
# Vereist het secret TRAFFIC_TOKEN: een fine-grained token met voor deze repository de
# permissie "Administration: Read-only". Het standaardtoken van Actions mag de
# verkeerscijfers niet lezen. Schrijven naar de branch gebeurt wel met het standaardtoken.
name: Statistieken ophalen

on:
  schedule:
    - cron: "17 6 * * 1" # elke maandag, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statistieken
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - name: Script ophalen (main)
        uses: actions/checkout@v4

      - name: Cijfers ophalen (branch statistieken)
        uses: actions/checkout@v4
        with:
          ref: statistieken
          path: data

      - name: Verkeerscijfers ophalen
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        # shell: bash zet pipefail aan, zodat een fout in het script de stap laat mislukken
        # (zonder pipefail verbergt `tee` de foutcode).
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret TRAFFIC_TOKEN ontbreekt. Zie de toelichting bovenaan deze workflow."
            exit 1
          fi
          python3 .github/scripts/statistieken.py data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vastleggen
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add per-dag.csv verwijzers.csv paden.csv
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Verkeerscijfers $(date -u +%F)"
            git push
          fi
